# Publica ¿Qué vemos? en GitHub Pages: al subir a main, cada día (para renovar el catálogo) y a mano.
# Si falla cualquier paso (tests, catálogo, build), no se publica nada y se queda la versión anterior.
name: Publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # cada día a las 05:17 UTC (06:17 o 07:17 en España)
  workflow_dispatch:

permissions:
  contents: read

# Una publicación a la vez; si llega otra, espera (no se cancela una a medias).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generar el catálogo (public/catalogo.json)
        run: node scripts/generar-catalogo.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    # Solo este trabajo puede publicar; el que ejecuta código del repositorio con la clave no tiene esos permisos.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
